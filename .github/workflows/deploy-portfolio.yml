name: Deploy Portal + Showcase

# Builds and publishes the GitHub Pages site for this repo:
#   /            -> static portal landing page (portal/index.html)
#   /showcase/   -> interactive React showcase (Vite build of portfolio-site/)
# Runs on pushes to main that touch the site, and can be triggered manually.
on:
  push:
    branches: [main]
    paths:
      - "portfolio-site/**"
      - "portal/**"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Build interactive showcase (Vite)
        working-directory: portfolio-site
        run: |
          npm ci
          npm run build

      - name: Assemble Pages site (portal at root, showcase at /showcase)
        run: |
          mkdir -p _site
          cp portal/index.html _site/index.html
          mkdir -p _site/showcase
          cp -r portfolio-site/dist/* _site/showcase/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
